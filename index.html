<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>家計簿</title>

    <link rel="stylesheet" href="./style.css?v=20260808-12" />
    <script src="./app.js?v=20260808-11" defer></script>
  </head>

  <body>
    <header class="app-header">
      <h1>家計簿</h1>
    </header>

    <main class="app-main">
      <!-- 入力画面 -->
      <section id="input-page" class="page active">
        <h2>収支を入力</h2>

        <form id="transaction-form" class="card">
          <div class="form-group">
            <label for="amount">金額</label>
            <div class="amount-input">
              <input
                id="amount"
                name="amount"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
                placeholder="例：850"
                required
              />
              <span>円</span>
            </div>
          </div>

          <div class="form-group">
            <label for="date">日付</label>
            <input id="date" name="date" type="date" required />
          </div>

          <div class="form-group">
            <span class="form-label">収入・支出</span>

            <div class="type-selector">
              <label>
                <input
                  type="radio"
                  name="transaction-type"
                  value="expense"
                  checked
                />
                <span>支出</span>
              </label>

              <label>
                <input
                  type="radio"
                  name="transaction-type"
                  value="income"
                />
                <span>収入</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="category">カテゴリ</label>

            <select id="category" name="category" required>
                <option value="">選択してください</option>
            </select>
          </div>

          <div class="form-group">
            <label for="transaction-name">名前</label>
            <input
              id="transaction-name"
              name="transaction-name"
              type="text"
              placeholder="例：昼食"
              maxlength="50"
            />
          </div>

          <div class="form-actions">
            <button
              id="submit-button"
              class="primary-button"
              type="submit"
            >
              登録
            </button>

            <button
              id="cancel-edit-button"
              class="secondary-button hidden"
              type="button"
            >
              編集をキャンセル
            </button>
          </div>

          <p id="form-message" class="form-message" aria-live="polite"></p>
        </form>
      </section>

      <!-- 履歴画面 -->
      <section id="history-page" class="page">
        <h2>履歴</h2>

        <div class="month-control">
          <label for="history-month">対象月</label>
          <input id="history-month" type="month" />
        </div>

        <div class="calendar">
          <div class="calendar-weekdays" aria-hidden="true">
            <div>日</div>
            <div>月</div>
            <div>火</div>
            <div>水</div>
            <div>木</div>
            <div>金</div>
            <div>土</div>
          </div>

          <div id="calendar-grid" class="calendar-grid"></div>
        </div>

        <div id="history-list" class="history-list"></div>
      </section>

      <!-- 集計画面 -->
      <section id="summary-page" class="page">
        <h2>集計</h2>

        <div class="month-control">
          <label for="summary-month">対象月</label>
          <input id="summary-month" type="month" />
        </div>

        <div class="summary-grid">
          <article class="summary-card">
            <span>月間収入</span>
            <strong id="monthly-income">0円</strong>
          </article>

          <article class="summary-card">
            <span>月間支出</span>
            <strong id="monthly-expense">0円</strong>
          </article>

          <article class="summary-card">
            <span>月間収支</span>
            <strong id="monthly-balance">0円</strong>
          </article>
        </div>

        <section class="card chart-card" aria-labelledby="expense-chart-title">
          <h3 id="expense-chart-title">支出カテゴリ</h3>

          <div id="expense-chart-content" class="chart-content">
            <svg
              id="expense-chart"
              class="pie-chart"
              viewBox="0 0 220 220"
              role="img"
            ></svg>

            <ul id="expense-chart-legend" class="chart-legend"></ul>
          </div>

          <p id="expense-chart-empty" class="chart-empty hidden"></p>
        </section>

        <section class="card chart-card" aria-labelledby="income-chart-title">
          <h3 id="income-chart-title">収入カテゴリ</h3>

          <div id="income-chart-content" class="chart-content">
            <svg
              id="income-chart"
              class="pie-chart"
              viewBox="0 0 220 220"
              role="img"
            ></svg>

            <ul id="income-chart-legend" class="chart-legend"></ul>
          </div>

          <p id="income-chart-empty" class="chart-empty hidden"></p>
        </section>

        <section class="card chart-card" aria-labelledby="yearly-chart-title">
          <div class="yearly-chart-heading">
            <h3 id="yearly-chart-title">年間収入・支出</h3>

            <label for="summary-year">
              対象年
              <select id="summary-year"></select>
            </label>
          </div>

          <div class="yearly-chart-legend" aria-hidden="true">
            <span><i class="income"></i>収入</span>
            <span><i class="expense"></i>支出</span>
          </div>

          <p id="yearly-chart-empty" class="chart-empty hidden"></p>

          <div class="yearly-chart-scroll" tabindex="0">
            <div
              id="yearly-chart"
              class="yearly-chart"
              role="img"
            ></div>
          </div>
        </section>
      </section>

      <!-- 固定収支画面 -->
      <section id="fixed-page" class="page">
        <h2>固定収支</h2>

        <form id="fixed-form" class="card fixed-form">
          <div class="form-group">
            <span class="form-label">収入・支出</span>

            <div class="type-selector">
              <label>
                <input
                  type="radio"
                  name="fixed-type"
                  value="expense"
                  checked
                />
                <span>支出</span>
              </label>

              <label>
                <input type="radio" name="fixed-type" value="income" />
                <span>収入</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="fixed-category">カテゴリ</label>
            <select id="fixed-category" required></select>
          </div>

          <div class="form-group">
            <label for="fixed-name">名前</label>
            <input
              id="fixed-name"
              type="text"
              maxlength="50"
              placeholder="例：家賃"
              required
            />
          </div>

          <div class="form-group">
            <label for="fixed-amount">金額</label>
            <div class="amount-input">
              <input
                id="fixed-amount"
                type="number"
                min="1"
                step="1"
                inputmode="numeric"
                required
              />
              <span>円</span>
            </div>
          </div>

          <div class="fixed-period-grid">
            <div class="form-group">
              <label for="fixed-day">毎月の日付</label>
              <select id="fixed-day" required></select>
            </div>

            <div class="form-group">
              <label for="fixed-start-month">開始月</label>
              <input id="fixed-start-month" type="month" required />
            </div>

            <div class="form-group">
              <label for="fixed-end-month">終了月（任意）</label>
              <input id="fixed-end-month" type="month" />
            </div>
          </div>

          <div class="form-actions">
            <button id="fixed-submit-button" class="primary-button" type="submit">
              登録
            </button>
            <button
              id="fixed-cancel-button"
              class="secondary-button hidden"
              type="button"
            >
              編集をキャンセル
            </button>
          </div>

          <p id="fixed-message" class="form-message" aria-live="polite"></p>
        </form>

        <section class="card fixed-generation">
          <h3>履歴へ反映</h3>
          <p>
            対象月に該当する有効な固定収支を、履歴へ一度だけ登録します。
          </p>

          <div class="fixed-generation-control">
            <label for="fixed-generation-month">対象月</label>
            <input id="fixed-generation-month" type="month" />
          </div>

          <button
            id="fixed-generation-button"
            class="primary-button"
            type="button"
          >
            この月の固定収支を反映
          </button>

          <p
            id="fixed-generation-message"
            class="form-message"
            aria-live="polite"
          ></p>
        </section>

        <div id="fixed-list" class="fixed-list"></div>
      </section>

      <!-- 設定画面 -->
      <section id="settings-page" class="page">
        <h2>設定</h2>

        <section class="card category-manager">
          <h3>カテゴリ管理</h3>

          <form id="category-add-form" class="category-add-form">
            <div class="form-group">
              <label for="category-type">収入・支出</label>

              <select id="category-type" name="category-type" required>
                <option value="expense">支出</option>
                <option value="income">収入</option>
              </select>
            </div>

            <div class="form-group">
              <label for="category-name">カテゴリ名</label>

              <input
                id="category-name"
                name="category-name"
                type="text"
                maxlength="30"
                placeholder="例：外食"
                required
              />
            </div>

            <button class="primary-button" type="submit">
              カテゴリを追加
            </button>

            <p
              id="category-message"
              class="form-message"
              aria-live="polite"
            ></p>
          </form>

          <div class="category-section">
            <h4>支出カテゴリ</h4>

            <ul
              id="expense-category-list"
              class="category-list"
            ></ul>
          </div>

          <div class="category-section">
            <h4>収入カテゴリ</h4>

            <ul
              id="income-category-list"
              class="category-list"
            ></ul>
          </div>
        </section>

        <div class="card settings-list backup-settings">
          <button id="backup-export-button" type="button">
            JSONバックアップ
          </button>
          <button id="backup-import-button" type="button">
            バックアップから復元
          </button>
          <input
            id="backup-file-input"
            class="hidden"
            type="file"
            accept="application/json,.json"
          />
          <button id="csv-export-button" type="button">CSV出力</button>
        </div>

        <p id="backup-message" class="backup-message" aria-live="polite"></p>

        <p class="note">復元すると現在のカテゴリと収支記録を置き換えます。</p>
      </section>
    </main>

    <!-- 下部タブ -->
    <nav class="bottom-navigation" aria-label="メインメニュー">
      <button
        class="nav-button active"
        type="button"
        data-page="input-page"
      >
        <span class="nav-icon">＋</span>
        <span>入力</span>
      </button>

      <button
        class="nav-button"
        type="button"
        data-page="history-page"
      >
        <span class="nav-icon">≡</span>
        <span>履歴</span>
      </button>

      <button
        class="nav-button"
        type="button"
        data-page="summary-page"
      >
        <span class="nav-icon">◯</span>
        <span>集計</span>
      </button>

      <button
        class="nav-button"
        type="button"
        data-page="fixed-page"
      >
        <span class="nav-icon">↻</span>
        <span>固定収支</span>
      </button>

      <button
        class="nav-button"
        type="button"
        data-page="settings-page"
      >
        <span class="nav-icon">⚙</span>
        <span>設定</span>
      </button>
    </nav>
  </body>
</html>
